<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100a14">
  <meta name="description" content="Lovely surprise loading for someone extraordinary.">
  <title>Lovely Surprise Loading ✨</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body class="loading-only-page">
  <div class="stars" aria-hidden="true"></div>
  <canvas class="sky" aria-hidden="true"></canvas>

  <main class="loader loader--standalone" id="loader" aria-labelledby="loader-title">
    <div class="loader-content" id="loaderStageLoading">
      <div class="loader-pulse-ring" aria-hidden="true">
        <span class="heart-pulse">💖</span>
        <span class="orbit-particle p1">✦</span>
        <span class="orbit-particle p2">✧</span>
        <span class="orbit-particle p3">✨</span>
      </div>
      <p class="loader-eyebrow">A Special Birthday Celebration</p>
      <h1 class="loader-title" id="loader-title">Lovely Surprise Loading<span class="dots">...</span></h1>
      <p class="loader-status" id="loaderStatusText">Gathering stardust and sweet memories...</p>
      
      <div class="progress-container" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="progress-percentage" id="progressPercentage">0%</div>

      <div class="standalone-action" id="standaloneAction" hidden>
        <a class="yes-button open-surprise-btn" href="index.html">Open Lovely Surprise ✨</a>
      </div>
    </div>
  </main>
</body>
</html>
